name: Migration dry-run (GET only)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Vercel production deploy
        env:
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            state=$(curl -fsS "https://api.github.com/repos/${REPOSITORY}/commits/${HEAD_SHA}/status" | jq -r '.state')
            echo "attempt ${attempt}: vercel/github state=${state}"
            if [ "$state" = "success" ]; then
              exit 0
            fi
            if [ "$state" = "failure" ]; then
              echo "Vercel deploy failed for ${HEAD_SHA}"
              exit 1
            fi
            sleep 20
          done
          echo "Timed out waiting for Vercel deploy on ${HEAD_SHA}"
          exit 1

      - name: GET pending migration plan
        env:
          SETUP_SECRET: ${{ secrets.INTERNAL_FILES_SETUP_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SETUP_SECRET:-}" ]; then
            echo "INTERNAL_FILES_SETUP_SECRET is not configured on this repo."
            exit 1
          fi
          response=$(curl -fsS \
            -H "x-setup-secret: ${SETUP_SECRET}" \
            "https://unit311central.com/api/internal/apply-unit311central-pending-migrations")
          echo "$response" | jq .
          echo "$response" | jq -e '.queryBackend != null' >/dev/null
          echo "$response" | jq -e '.plan != null' >/dev/null
          echo "$response" | jq -e '.queryError == null' >/dev/null
          echo "$response" | jq -e '
            ([.plan.actions[] | select(.kind == "apply")] | length) == 1
          ' >/dev/null
          echo "$response" | jq -e '
            ([.plan.actions[] | select(.kind == "apply" and .migration == "supabase/migrations/149_sales_management_foundation.sql")] | length) == 1
          ' >/dev/null
          echo "$response" | jq -e '
            ([.plan.actions[] | select(.kind == "skip" and .method == "verified_skip")] | length) >= 85
          ' >/dev/null
          echo "$response" | jq -e '
            (.plan.pending | index("supabase/migrations/149_sales_management_foundation.sql")) != null
          ' >/dev/null
