name: Post-deploy migrations

# POST pending migrations via authenticated production runner (apply step only).
# Migration 150 satisfied in production (schema pre-existed; verified_skip is valid).
# Migration 157: customer workspace reporting currency GBP → USD (data-only UPDATE).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-migrations.yml
  workflow_run:
    workflows: ["Web CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  migrate-and-verify:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Wait for Vercel production deploy
        env:
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            http_code=$(curl -sS -o /tmp/gh-commit-status.json -w "%{http_code}" \
              "https://api.github.com/repos/${REPOSITORY}/commits/${HEAD_SHA}/status")
            if [ "$http_code" = "403" ] || [ "$http_code" = "429" ]; then
              echo "GitHub commit status API returned ${http_code} — retrying after backoff..."
              sleep 30
              continue
            fi
            if [ "$http_code" != "200" ]; then
              echo "Unexpected HTTP ${http_code} from GitHub commit status API"
              exit 1
            fi
            payload=$(cat /tmp/gh-commit-status.json)
            state=$(echo "$payload" | jq -r '.state')
            vercel_status=$(echo "$payload" | jq -r '.statuses[]? | select(.context == "Vercel") | .state' | head -n1)
            echo "attempt ${attempt}: aggregate=${state} vercel=${vercel_status:-unknown}"
            if [ "$state" = "success" ] && [ "${vercel_status:-}" = "success" ]; then
              echo "Waiting 90s for Vercel edge/serverless propagation..."
              sleep 90
              exit 0
            fi
            if [ "$state" = "failure" ] || [ "$vercel_status" = "failure" ]; then
              echo "Vercel deploy failed for ${HEAD_SHA}"
              exit 1
            fi
            sleep 20
          done
          echo "Timed out waiting for Vercel deploy on ${HEAD_SHA}"
          exit 1

      - name: Apply pending Supabase migrations
        env:
          SETUP_SECRET: ${{ secrets.INTERNAL_FILES_SETUP_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SETUP_SECRET:-}" ]; then
            echo "INTERNAL_FILES_SETUP_SECRET is not configured on this repo."
            exit 1
          fi
          response=$(curl -fsS -X POST \
            -H "x-setup-secret: ${SETUP_SECRET}" \
            -H "Content-Type: application/json" \
            "https://unit311central.com/api/internal/apply-unit311central-pending-migrations")
          echo "$response" | jq .
          echo "$response" | jq -e '.ok == true' >/dev/null
          echo "$response" | jq -e '
            ([.errors[]?] | length) == 0
          ' >/dev/null
          echo "$response" | jq -e '
            (
              ([.applied[]? | select(.migration == "supabase/migrations/151_workspace_phase3_provisioning.sql")] | length) == 1
            ) or (
              ([.skipped[]? | select(.migration == "supabase/migrations/151_workspace_phase3_provisioning.sql")] | length) == 1
            ) or (
              (.pending | index("supabase/migrations/151_workspace_phase3_provisioning.sql")) == null
            )
          ' >/dev/null
          echo "$response" | jq -e '
            (
              ([.applied[]? | select(.migration == "supabase/migrations/150_workspace_admin_metadata.sql")] | length) == 1
            ) or (
              ([.skipped[]? | select(.migration == "supabase/migrations/150_workspace_admin_metadata.sql")] | length) == 1
            ) or (
              (.pending | index("supabase/migrations/150_workspace_admin_metadata.sql")) == null
            )
          ' >/dev/null
          echo "$response" | jq -e '
            (
              ([.applied[]? | select(.migration == "supabase/migrations/157_customer_workspace_currency_usd.sql")] | length) == 1
            ) or (
              ([.skipped[]? | select(.migration == "supabase/migrations/157_customer_workspace_currency_usd.sql")] | length) == 1
            ) or (
              (.pending | index("supabase/migrations/157_customer_workspace_currency_usd.sql")) == null
            )
          ' >/dev/null
          echo "$response" | jq -e '
            (
              ([.applied[]? | select(.migration == "supabase/migrations/162_expense_management_foundation.sql")] | length) == 1
            ) or (
              ([.skipped[]? | select(.migration == "supabase/migrations/162_expense_management_foundation.sql")] | length) == 1
            ) or (
              (.pending | index("supabase/migrations/162_expense_management_foundation.sql")) == null
            )
          ' >/dev/null
          echo "$response" | jq -e '
            (
              ([.applied[]? | select(.migration == "supabase/migrations/163_technology_telecom_services.sql")] | length) == 1
            ) or (
              ([.skipped[]? | select(.migration == "supabase/migrations/163_technology_telecom_services.sql")] | length) == 1
            ) or (
              (.pending | index("supabase/migrations/163_technology_telecom_services.sql")) == null
            )
          ' >/dev/null

      - name: GET verify migration plan after apply
        env:
          SETUP_SECRET: ${{ secrets.INTERNAL_FILES_SETUP_SECRET }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            response=$(curl -fsS \
              -H "x-setup-secret: ${SETUP_SECRET}" \
              "https://unit311central.com/api/internal/apply-unit311central-pending-migrations")
            echo "attempt ${attempt}:"
            echo "$response" | jq .
            if echo "$response" | jq -e '.queryError == null' >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Migration plan verify failed after retries"
              exit 1
            fi
            echo "queryError present — retrying after Supabase Management API cooldown..."
            sleep 20
          done
          echo "$response" | jq -e '
            ([.plan.pending[]?] | length) == 0
          ' >/dev/null
          echo "$response" | jq -e '
            (.plan.satisfied | index("supabase/migrations/151_workspace_phase3_provisioning.sql")) != null
          ' >/dev/null
          echo "$response" | jq -e '
            (.plan.satisfied | index("supabase/migrations/150_workspace_admin_metadata.sql")) != null
          ' >/dev/null
          echo "$response" | jq -e '
            (.plan.satisfied | index("supabase/migrations/149_sales_management_foundation.sql")) != null
          ' >/dev/null
          echo "$response" | jq -e '
            (.plan.satisfied | index("supabase/migrations/157_customer_workspace_currency_usd.sql")) != null
          ' >/dev/null
          echo "$response" | jq -e '
            (.plan.satisfied | index("supabase/migrations/162_expense_management_foundation.sql")) != null
          ' >/dev/null
          echo "$response" | jq -e '
            (.plan.satisfied | index("supabase/migrations/163_technology_telecom_services.sql")) != null
          ' >/dev/null
          echo "$response" | jq -e '
            (.plan.satisfied | index("supabase/migrations/170_saec_installations.sql")) != null
          ' >/dev/null
          echo "$response" | jq -e '
            ([.plan.actions[] | select(.kind == "apply")] | length) == 0
          ' >/dev/null

      - name: Verify Wave 0 foundation health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            body=$(curl -fsS "https://unit311central.com/api/internal/wave0-foundation-health" || true)
            echo "attempt ${attempt}: ${body}"
            if echo "$body" | jq -e '.ok == true and .ready == true' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 15
          done
          echo "Wave 0 foundation health check failed"
          exit 1

      - name: Verify company details health
        run: |
          set -euo pipefail
          body=$(curl -fsS "https://unit311central.com/api/internal/company-details-health")
          echo "$body" | jq .
          echo "$body" | jq -e '.ok == true and .ready == true' >/dev/null
