name: Provision WOLF Central

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Provision WOLF Central via production internal API
        env:
          SETUP_SECRET: ${{ secrets.INTERNAL_FILES_SETUP_SECRET }}
          WOLF_PASSWORD: ${{ secrets.WOLF_INITIAL_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SETUP_SECRET:-}" ]; then
            echo "INTERNAL_FILES_SETUP_SECRET is not configured on this repo."
            exit 1
          fi
          if [ -z "${WOLF_PASSWORD:-}" ]; then
            echo "WOLF_INITIAL_ADMIN_PASSWORD is not configured on this repo."
            exit 1
          fi
          response=$(curl -fsS -X POST \
            -H "x-setup-secret: ${SETUP_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg password "$WOLF_PASSWORD" '{password: $password}')" \
            "https://unit311central.com/api/internal/provision-wolf-central")
          echo "$response" | jq .
          echo "$response" | jq -e '.ok == true' >/dev/null
          echo "$response" | jq -e '.slug == "wolf-central"' >/dev/null
          echo "$response" | jq -e '.initialAdminEmail == "admin@wolf.unit311central.com"' >/dev/null
