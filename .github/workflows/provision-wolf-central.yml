name: Provision WOLF Central

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Vercel production deploy
        env:
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            http_code=$(curl -fsS -o /tmp/gh-commit-status.json -w "%{http_code}" \
              "https://api.github.com/repos/${REPOSITORY}/commits/${HEAD_SHA}/status" || echo "000")
            if [ "$http_code" = "403" ] || [ "$http_code" = "429" ]; then
              echo "GitHub commit status API returned ${http_code} — retrying after backoff..."
              sleep 30
              continue
            fi
            if [ "$http_code" != "200" ]; then
              echo "Unexpected HTTP ${http_code} from GitHub commit status API"
              exit 1
            fi
            payload=$(cat /tmp/gh-commit-status.json)
            state=$(echo "$payload" | jq -r '.state')
            vercel_status=$(echo "$payload" | jq -r '.statuses[]? | select(.context == "Vercel") | .state' | head -n1)
            echo "attempt ${attempt}: aggregate=${state} vercel=${vercel_status:-unknown}"
            if [ "$state" = "success" ] && [ "${vercel_status:-}" = "success" ]; then
              echo "Waiting 90s for Vercel edge/serverless propagation..."
              sleep 90
              exit 0
            fi
            if [ "$state" = "failure" ] || [ "$vercel_status" = "failure" ]; then
              echo "Vercel deploy failed for ${HEAD_SHA}"
              exit 1
            fi
            sleep 20
          done
          echo "Timed out waiting for Vercel deploy on ${HEAD_SHA}"
          exit 1

      - name: Provision WOLF Central via production internal API
        env:
          SETUP_SECRET: ${{ secrets.INTERNAL_FILES_SETUP_SECRET }}
          WOLF_PASSWORD: ${{ secrets.WOLF_INITIAL_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SETUP_SECRET:-}" ]; then
            echo "INTERNAL_FILES_SETUP_SECRET is not configured on this repo."
            exit 1
          fi
          if [ -z "${WOLF_PASSWORD:-}" ]; then
            echo "WOLF_INITIAL_ADMIN_PASSWORD is not configured on this repo."
            exit 1
          fi
          response=$(curl -fsS -X POST \
            -H "x-setup-secret: ${SETUP_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg password "$WOLF_PASSWORD" '{password: $password}')" \
            "https://unit311central.com/api/internal/provision-wolf-central")
          echo "$response" | jq .
          echo "$response" | jq -e '.ok == true' >/dev/null
          echo "$response" | jq -e '.slug == "wolf-central"' >/dev/null
          echo "$response" | jq -e '.initialAdminEmail == "admin@wolf.unit311central.com"' >/dev/null
