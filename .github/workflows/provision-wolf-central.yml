name: Provision WOLF Central

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/provision-wolf-central.yml

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Provision WOLF Central workspace
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          WOLF_INITIAL_ADMIN_PASSWORD: ${{ secrets.WOLF_INITIAL_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured on this repo."
            exit 1
          fi
          if [ -z "${WOLF_INITIAL_ADMIN_PASSWORD:-}" ]; then
            echo "WOLF_INITIAL_ADMIN_PASSWORD is not configured on this repo."
            exit 1
          fi
          npx tsx scripts/provision-wolf-central.ts
